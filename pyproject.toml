[project]
name = "geotekt"
version = "1.0.0"
description = "Utility scripts for the Geotekton project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow",
    "pygplates>=1.0.0",
]
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# The scripting package is not installed into the environment: the application
# starts it by path, and the tests import it the same way.
pythonpath = ["src"]
testpaths = ["Tests/Python"]
